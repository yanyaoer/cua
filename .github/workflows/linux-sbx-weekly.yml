name: "Weekly: Linux sandbox driver"

# Rebases the `linux-sbx-patch` branch of this fork once a week onto the newest
# upstream Cua Driver release, builds the Linux x86_64 archives, signs them, and
# leaves everything as one run artifact. It pushes nothing and releases
# nothing: the job token may not push commits that change workflow files, and
# this fork keeps no other credential on GitHub. Publishing (pushing the branch
# and creating the prerelease) is .github/scripts/linux-sbx/publish_local.sh,
# run on a maintainer's machine with their own gh login; see the README there.
#
# Every decision lives in .github/scripts/linux-sbx/ so it can be run and tested
# outside Actions; the jobs here only hold triggers, permissions, env and step
# order:
#
#   select_upstream_tag.sh       highest stable cua-driver-rs-vX.Y.Z tag upstream
#   next_prerelease_tag.sh       cua-driver-rs-vX.Y.Z-linux-sbx.<N> candidate
#   rebase_onto_tag.sh           replay the patch commits; stop on conflict
#   prune_upstream_workflows.sh  commit removing upstream's other workflows
#   make_source_bundle.sh        git bundle of the result, plus metadata
#   report_conflict.sh           conflict issue, and a red run either way
#   apt_bootstrap.sh             Debian 11 packages, snapshot then archive mirror
#   checkout_from_bundle.sh      build source comes out of the bundle
#   pack_linux_artifact.sh       archives, SHA256SUMS, smoke test
#   assemble_release.sh          build output + bundle, checked against metadata
#   sign_release_assets.sh       cosign keyless signatures (OIDC, no private key)
#
# This workflow never uses the upstream reusable workflow
# (cd-rust-cua-driver.yml): its Windows and macOS jobs run unconditionally under
# workflow_call and need Azure and Apple signing credentials this fork does not
# hold. The build below mirrors that workflow's Linux x86_64 job instead, inside
# the same Debian 11 container that pins its glibc floor.
#
# Schedules and the Run workflow button only see the copy of this file on the
# repository's default branch, so the fork's default branch has to be
# linux-sbx-patch for either to work (see .github/scripts/linux-sbx/README.md).

on:
  schedule:
    # Monday 05:23 UTC: after the weekend's Release Please merges, before the
    # working day, and off the hour so it does not queue with the hourly jobs
    # GitHub scheduled workflows compete with.
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Exact upstream tag to rebase onto (default: the newest stable cua-driver-rs-vX.Y.Z). Runs never push or release; publish_local.sh does."
        required: false
        type: string

# Least privilege: no scope at the top, each job asks for what it uses.
# Artifacts of the same run move with the runtime token, not GITHUB_TOKEN.
permissions: {}

concurrency:
  group: linux-sbx-weekly
  cancel-in-progress: false

# Every run step is Bash, including the ones inside the debian:11 container,
# where GitHub would otherwise use sh (dash) and reject `set -o pipefail`.
defaults:
  run:
    shell: bash

env:
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  # The upstream project whose stable tags define the rebase baseline.
  UPSTREAM_REPOSITORY: trycua/cua
  PATCH_BRANCH: linux-sbx-patch
  SCRIPTS: .github/scripts/linux-sbx

jobs:
  rebase:
    name: Rebase linux-sbx-patch onto ${{ github.event.inputs.upstream_tag || 'the newest upstream release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reads the branch; never pushes.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.prune.outputs.sha }}
      upstream_tag: ${{ steps.select.outputs.tag }}
      prerelease: ${{ steps.prerelease.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select the upstream release tag
        id: select
        env:
          UPSTREAM_URL: https://github.com/${{ env.UPSTREAM_REPOSITORY }}
          EXACT_TAG: ${{ github.event.inputs.upstream_tag }}
        run: |
          set -euo pipefail
          ARGS=(--remote-url "$UPSTREAM_URL")
          if [[ -n "$EXACT_TAG" ]]; then ARGS+=(--exact "$EXACT_TAG"); fi
          "$SCRIPTS/select_upstream_tag.sh" "${ARGS[@]}"

      - name: Compute the prerelease tag candidate
        id: prerelease
        env:
          UPSTREAM_VERSION: ${{ steps.select.outputs.version }}
          FORK_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          "$SCRIPTS/next_prerelease_tag.sh" --version "$UPSTREAM_VERSION" --remote-url "$FORK_URL"

      - name: Rebase the patch branch onto the tag
        id: rebase
        env:
          UPSTREAM_TAG: ${{ steps.select.outputs.tag }}
          UPSTREAM_URL: https://github.com/${{ env.UPSTREAM_REPOSITORY }}
          CONFLICT_REPORT: ${{ runner.temp }}/linux-sbx-rebase-conflict.md
        run: |
          set -euo pipefail
          "$SCRIPTS/rebase_onto_tag.sh" \
            --branch "$PATCH_BRANCH" \
            --upstream-ref "$UPSTREAM_TAG" \
            --upstream-url "$UPSTREAM_URL" \
            --conflict-report "$CONFLICT_REPORT"

      - name: Remove upstream's other workflows
        id: prune
        run: |
          set -euo pipefail
          "$SCRIPTS/prune_upstream_workflows.sh" --keep linux-sbx-weekly.yml

      - name: Bundle the rebased branch
        env:
          UPSTREAM_TAG: ${{ steps.select.outputs.tag }}
          PREVIOUS_SHA: ${{ steps.rebase.outputs.previous_sha }}
          PRERELEASE_TAG: ${{ steps.prerelease.outputs.tag }}
          REBASE_RESULT: ${{ steps.rebase.outputs.result }}
          PATCH_COMMITS: ${{ steps.rebase.outputs.patch_commits }}
        run: |
          set -euo pipefail
          "$SCRIPTS/make_source_bundle.sh" \
            --branch "$PATCH_BRANCH" \
            --upstream-tag "$UPSTREAM_TAG" \
            --previous-sha "$PREVIOUS_SHA" \
            --prerelease-tag "$PRERELEASE_TAG" \
            --rebase-result "$REBASE_RESULT" \
            --patch-commits "$PATCH_COMMITS" \
            --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --out "$RUNNER_TEMP/source"

      - name: Upload the source bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-sbx-source
          path: ${{ runner.temp }}/source
          if-no-files-found: error
          retention-days: 7

      # The debian:11 build container has no git or curl until apt runs, and
      # the attest job checks nothing out: both take the scripts from here.
      - name: Upload the scripts
        uses: actions/upload-artifact@v4
        with:
          name: linux-sbx-scripts
          path: ${{ env.SCRIPTS }}
          if-no-files-found: error
          retention-days: 1

      # Kept as evidence for the conflict job and for whoever resolves it: the
      # job log scrolls away, the artifact does not.
      - name: Upload the conflict report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebase-conflict
          path: ${{ runner.temp }}/linux-sbx-rebase-conflict.md
          if-no-files-found: ignore
          retention-days: 30

  conflict:
    name: Report the rebase conflict
    needs: rebase
    # `always()` because rebase failed; the failure is what brought us here.
    if: ${{ always() && needs.rebase.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/linux-sbx
          persist-credentials: false

      # Absent when the rebase job failed for a reason other than a conflict;
      # report_conflict.sh tells the two apart and fails either way.
      - name: Download the conflict report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rebase-conflict
          path: ${{ runner.temp }}/conflict

      - name: Open the conflict issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_TAG: ${{ needs.rebase.outputs.upstream_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          "$SCRIPTS/report_conflict.sh" \
            --report "$RUNNER_TEMP/conflict/linux-sbx-rebase-conflict.md" \
            --branch "$PATCH_BRANCH" \
            --tag "$UPSTREAM_TAG" \
            --run-url "$RUN_URL"

  build:
    name: Build linux-x86_64
    needs: rebase
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Nothing here talks to this repository: the source comes from the bundle
    # and the upstream tag is public.
    permissions: {}
    # Same container as the upstream build-linux job: Debian 11's glibc is 2.31,
    # so the binaries run on Debian 11+ and Ubuntu 20.04+. The ubuntu-latest
    # host image (glibc 2.39) would raise that floor silently.
    container:
      image: debian:11
    steps:
      - name: Fetch the scripts
        uses: actions/download-artifact@v4
        with:
          name: linux-sbx-scripts
          path: ${{ runner.temp }}/scripts

      - name: Install base tooling (container is bare)
        run: sh "$RUNNER_TEMP/scripts/apt_bootstrap.sh"

      - name: Fetch the source bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-sbx-source
          path: ${{ runner.temp }}/source

      - name: Check out the rebased source from the bundle
        env:
          UPSTREAM_URL: https://github.com/${{ env.UPSTREAM_REPOSITORY }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/scripts/checkout_from_bundle.sh" \
            --source-dir "$RUNNER_TEMP/source" \
            --upstream-url "$UPSTREAM_URL" \
            --dest "$GITHUB_WORKSPACE" \
            --trust-dest \
            --copy-metadata-to "$RUNNER_TEMP/build-out/source"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: libs/cua-driver/typescript/package-lock.json

      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            libs/cua-driver/rust/target
          key: rust-linux-sbx-x86_64-${{ hashFiles('libs/cua-driver/rust/Cargo.lock', 'libs/cua-driver/rust/**/Cargo.toml') }}
          restore-keys: |
            rust-linux-sbx-x86_64-

      - name: Build (release)
        working-directory: libs/cua-driver/rust
        env:
          # Record the source revision the archives came from. build.rs reads
          # this before falling back to `git rev-parse`.
          CUA_DRIVER_GIT_SHA: ${{ needs.rebase.outputs.sha }}
        run: cargo build --locked -p cua-driver -p cursor-theme-cli -p cua-driver-sdk --release --features cua-driver/portal-input --target x86_64-unknown-linux-gnu

      - name: Build Electron-compatible Node runtime
        working-directory: libs/cua-driver
        run: |
          set -euo pipefail
          npm --prefix typescript ci --ignore-scripts
          node scripts/build-node-runtime.mjs \
            --target x86_64-unknown-linux-gnu \
            --output "rust/target/x86_64-unknown-linux-gnu/release/cua_driver_node_runtime.node"

      # Archive names carry the fork's own version, so they cannot be mistaken
      # for upstream's: cua-driver-rs-<upstream>-linux-sbx.<N>-linux-x86_64.
      - name: Package and smoke test
        env:
          VERSION: ${{ needs.rebase.outputs.prerelease }}
        run: |
          set -euo pipefail
          "$SCRIPTS/pack_linux_artifact.sh" \
            --version "$VERSION" \
            --arch x86_64 \
            --target x86_64-unknown-linux-gnu \
            --out-dir "$RUNNER_TEMP/build-out/dist" \
            --smoke

      # Binaries plus the metadata they were built against (upstream tag,
      # rebased sha, bundle sha256, prerelease candidate), staged under one
      # directory by the two steps above. One single-line path on purpose: in a
      # container job the runner maps a host path in `with:` to the container
      # only at the start of the value, so the lines after the first of a
      # multi-line `path:` would point at nothing and be skipped silently.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-sbx-build
          path: ${{ runner.temp }}/build-out
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Sign and attest the release artifact
    needs: [rebase, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The OIDC identity cosign and the provenance attestation sign with; no
      # private key exists in this public fork. Neither pushes nor releases.
      id-token: write
      attestations: write
    steps:
      - name: Fetch the scripts
        uses: actions/download-artifact@v4
        with:
          name: linux-sbx-scripts
          path: ${{ runner.temp }}/scripts

      - name: Fetch the source bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-sbx-source
          path: ${{ runner.temp }}/in/source

      - name: Fetch the build output
        uses: actions/download-artifact@v4
        with:
          name: linux-sbx-build
          path: ${{ runner.temp }}/in/build

      - name: Assemble and cross-check
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/scripts/assemble_release.sh" \
            --build-dir "$RUNNER_TEMP/in/build" \
            --source-dir "$RUNNER_TEMP/in/source" \
            --out "$RUNNER_TEMP/release"

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign the release assets keylessly
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/scripts/sign_release_assets.sh" --dir "$RUNNER_TEMP/release/dist"

      # What publish_local.sh checks with `gh attestation verify`.
      # Unpinned like the other attest-build-provenance use in this repository
      # (cd-cua-spaces-build.yml).
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ runner.temp }}/release/dist/*.tar.gz
            ${{ runner.temp }}/release/dist/SHA256SUMS
            ${{ runner.temp }}/release/source/*

      - name: Upload the release artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-sbx-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30
