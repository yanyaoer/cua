name: "Weekly: Linux sandbox driver"

# Rebuilds the `linux-sbx-patch` branch of this fork once a week on top of the
# newest upstream Cua Driver release, builds the Linux x86_64 archives, and
# publishes them as a prerelease of this repository.
#
# The branch carries local patches on top of upstream. Upstream moves, so this
# replays those patches onto the newest stable `cua-driver-rs-v*` tag instead of
# letting them drift. Every decision lives in .github/scripts/linux-sbx/ so it
# can be run and tested outside Actions; the jobs here only hold triggers,
# permissions, env and step order:
#
#   select_upstream_tag.sh     highest stable cua-driver-rs-vX.Y.Z tag upstream
#   next_prerelease_tag.sh     cua-driver-rs-vX.Y.Z-linux-sbx.<N> for this build
#   rebase_onto_tag.sh         replay the patch commits; stop on conflict
#   report_conflict.sh         conflict issue, and a red run either way
#   apt_bootstrap.sh           Debian 11 packages, snapshot then archive mirror
#   pack_linux_artifact.sh     archives, SHA256SUMS, smoke test
#   sign_release_assets.sh     cosign keyless signatures (OIDC, no private key)
#   publish_prerelease.sh      release notes and the prerelease itself
#   verify_release_assets.sh   every published file is there and signed
#
# This workflow never uses the upstream reusable workflow
# (cd-rust-cua-driver.yml): its Windows and macOS jobs run unconditionally under
# workflow_call and need Azure and Apple signing credentials this fork does not
# hold, so every run would fail before the Linux job could report anything. The
# build below mirrors that workflow's Linux x86_64 job instead, inside the same
# Debian 11 container that pins its glibc floor.
#
# Schedules and the Run workflow button only see the copy of this file on the
# repository's default branch, so the fork's default branch has to be
# linux-sbx-patch for either to work (see .github/scripts/linux-sbx/README.md).

on:
  schedule:
    # Monday 05:23 UTC: after the weekend's Release Please merges, before the
    # working day, and off the hour so it does not queue with the hourly jobs
    # GitHub scheduled workflows compete with.
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Exact upstream tag to rebase onto (default: the newest stable cua-driver-rs-vX.Y.Z)"
        required: false
        type: string
      publish:
        description: "Publish the prerelease (off: rebase and build only; unsigned archives stay as a run artifact, nothing is released)"
        required: false
        default: true
        type: boolean
      skip_push:
        description: "Rehearse the rebase without pushing linux-sbx-patch (skips the build: it needs the pushed commit)"
        required: false
        default: false
        type: boolean

# Least privilege: no scope at the top, each job asks for what it uses.
permissions: {}

concurrency:
  group: linux-sbx-weekly
  cancel-in-progress: false

# Every run step is Bash, including the ones inside the debian:11 container,
# where GitHub would otherwise use sh (dash) and reject `set -o pipefail`.
defaults:
  run:
    shell: bash

env:
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  # The upstream project whose stable tags define the rebase baseline.
  UPSTREAM_REPOSITORY: trycua/cua
  PATCH_BRANCH: linux-sbx-patch
  SCRIPTS: .github/scripts/linux-sbx

jobs:
  rebase:
    name: Rebase linux-sbx-patch onto ${{ github.event.inputs.upstream_tag || 'the newest upstream release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pushes the rebased branch back to this repository.
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.rebase.outputs.sha }}
      result: ${{ steps.rebase.outputs.result }}
      patch_commits: ${{ steps.rebase.outputs.patch_commits }}
      version: ${{ steps.select.outputs.version }}
      upstream_tag: ${{ steps.select.outputs.tag }}
      prerelease: ${{ steps.prerelease.outputs.prerelease }}
      prerelease_tag: ${{ steps.prerelease.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0
          # The push below authenticates with this job's GITHUB_TOKEN.
          persist-credentials: true

      - name: Select the upstream release tag
        id: select
        env:
          UPSTREAM_URL: https://github.com/${{ env.UPSTREAM_REPOSITORY }}
          EXACT_TAG: ${{ github.event.inputs.upstream_tag }}
        run: |
          set -euo pipefail
          ARGS=(--remote-url "$UPSTREAM_URL")
          if [[ -n "$EXACT_TAG" ]]; then ARGS+=(--exact "$EXACT_TAG"); fi
          "$SCRIPTS/select_upstream_tag.sh" "${ARGS[@]}"

      - name: Compute the next prerelease tag
        id: prerelease
        env:
          UPSTREAM_VERSION: ${{ steps.select.outputs.version }}
          FORK_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          "$SCRIPTS/next_prerelease_tag.sh" --version "$UPSTREAM_VERSION" --remote-url "$FORK_URL"

      - name: Rebase the patch branch onto the tag
        id: rebase
        env:
          UPSTREAM_TAG: ${{ steps.select.outputs.tag }}
          UPSTREAM_URL: https://github.com/${{ env.UPSTREAM_REPOSITORY }}
          SKIP_PUSH: ${{ github.event.inputs.skip_push == 'true' }}
          CONFLICT_REPORT: ${{ runner.temp }}/linux-sbx-rebase-conflict.md
        run: |
          set -euo pipefail
          ARGS=(
            --branch "$PATCH_BRANCH"
            --upstream-ref "$UPSTREAM_TAG"
            --upstream-url "$UPSTREAM_URL"
            --conflict-report "$CONFLICT_REPORT"
          )
          if [[ "$SKIP_PUSH" != "true" ]]; then ARGS+=(--push); fi
          "$SCRIPTS/rebase_onto_tag.sh" "${ARGS[@]}"

      # The debian:11 build container has no git or curl until apt runs, so it
      # cannot check out the repository to reach apt_bootstrap.sh. Hand it the
      # script from the rebased tree instead.
      - name: Hand the apt bootstrap to the build container
        uses: actions/upload-artifact@v4
        with:
          name: linux-sbx-bootstrap
          path: ${{ env.SCRIPTS }}/apt_bootstrap.sh
          if-no-files-found: error
          retention-days: 1

      # Kept as evidence for the conflict job and for whoever resolves it: the
      # job log scrolls away, the artifact does not.
      - name: Upload the conflict report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebase-conflict
          path: ${{ runner.temp }}/linux-sbx-rebase-conflict.md
          if-no-files-found: ignore
          retention-days: 30

  conflict:
    name: Report the rebase conflict
    needs: rebase
    # `always()` because rebase failed; the failure is what brought us here.
    if: ${{ always() && needs.rebase.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Artifacts from the same run download with the runtime token, so no
    # actions scope is needed here, in build or in publish.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/linux-sbx
          persist-credentials: false

      # Absent when the rebase failed for a reason other than a conflict;
      # report_conflict.sh tells the two apart.
      - name: Download the conflict report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rebase-conflict
          path: ${{ runner.temp }}/conflict

      - name: Open the conflict issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_TAG: ${{ needs.rebase.outputs.upstream_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          "$SCRIPTS/report_conflict.sh" \
            --report "$RUNNER_TEMP/conflict/linux-sbx-rebase-conflict.md" \
            --branch "$PATCH_BRANCH" \
            --tag "$UPSTREAM_TAG" \
            --run-url "$RUN_URL"

  build:
    name: Build linux-x86_64
    needs: rebase
    # skip_push leaves the rebased commit only on the rebase runner, so there is
    # nothing for this job to check out. Say that with a skip, not a failure.
    if: ${{ needs.rebase.result == 'success' && github.event.inputs.skip_push != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # Same container as the upstream build-linux job: Debian 11's glibc is 2.31,
    # so the binaries run on Debian 11+ and Ubuntu 20.04+. The ubuntu-latest
    # host image (glibc 2.39) would raise that floor silently.
    container:
      image: debian:11
    steps:
      - name: Fetch the apt bootstrap
        uses: actions/download-artifact@v4
        with:
          name: linux-sbx-bootstrap
          path: ${{ runner.temp }}/bootstrap

      - name: Install base tooling (container is bare)
        run: sh "$RUNNER_TEMP/bootstrap/apt_bootstrap.sh"

      # The exact commit the rebase job pushed: the branch may have moved since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebase.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: libs/cua-driver/typescript/package-lock.json

      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            libs/cua-driver/rust/target
          key: rust-linux-sbx-x86_64-${{ hashFiles('libs/cua-driver/rust/Cargo.lock', 'libs/cua-driver/rust/**/Cargo.toml') }}
          restore-keys: |
            rust-linux-sbx-x86_64-

      - name: Build (release)
        working-directory: libs/cua-driver/rust
        env:
          # Record the source revision the archives came from. build.rs reads
          # this before falling back to `git rev-parse`.
          CUA_DRIVER_GIT_SHA: ${{ needs.rebase.outputs.sha }}
        run: cargo build --locked -p cua-driver -p cursor-theme-cli -p cua-driver-sdk --release --features cua-driver/portal-input --target x86_64-unknown-linux-gnu

      - name: Build Electron-compatible Node runtime
        working-directory: libs/cua-driver
        run: |
          set -euo pipefail
          npm --prefix typescript ci --ignore-scripts
          node scripts/build-node-runtime.mjs \
            --target x86_64-unknown-linux-gnu \
            --output "rust/target/x86_64-unknown-linux-gnu/release/cua_driver_node_runtime.node"

      # Archive names carry the fork's own version, so they cannot be mistaken
      # for upstream's: cua-driver-rs-<upstream>-linux-sbx.<N>-linux-x86_64.
      - name: Package and smoke test
        env:
          VERSION: ${{ needs.rebase.outputs.prerelease }}
        run: |
          set -euo pipefail
          "$SCRIPTS/pack_linux_artifact.sh" \
            --version "$VERSION" \
            --arch x86_64 \
            --target x86_64-unknown-linux-gnu \
            --out-dir "$RUNNER_TEMP/dist" \
            --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: linux-sbx-x86_64
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ needs.rebase.outputs.prerelease_tag }}
    needs: [rebase, build]
    # inputs is empty on a schedule run, so `!= false` (not `== true`) is what
    # keeps publishing on by default and lets a dispatch turn it off.
    if: ${{ needs.build.result == 'success' && github.event.inputs.publish != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # contents: write creates the tag and the release; id-token is the OIDC
      # identity cosign signs with, so no private key ever exists in this
      # public fork.
      contents: write
      id-token: write
    steps:
      # The commit that was built, so the scripts that sign and publish are the
      # ones from the released source, whichever branch triggered the run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebase.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: linux-sbx-x86_64
          path: ${{ runner.temp }}/dist

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign the assets keylessly
        run: |
          set -euo pipefail
          "$SCRIPTS/sign_release_assets.sh" --dir "$RUNNER_TEMP/dist"

      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.rebase.outputs.prerelease_tag }}
          SOURCE_SHA: ${{ needs.rebase.outputs.sha }}
          UPSTREAM_TAG: ${{ needs.rebase.outputs.upstream_tag }}
          REBASE_RESULT: ${{ needs.rebase.outputs.result }}
          PATCH_COMMITS: ${{ needs.rebase.outputs.patch_commits }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          "$SCRIPTS/publish_prerelease.sh" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --upstream-tag "$UPSTREAM_TAG" \
            --upstream-repo "$UPSTREAM_REPOSITORY" \
            --repository "$REPOSITORY" \
            --branch "$PATCH_BRANCH" \
            --dist "$RUNNER_TEMP/dist" \
            --rebase-result "$REBASE_RESULT" \
            --patch-commits "$PATCH_COMMITS"

      - name: Verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.rebase.outputs.prerelease_tag }}
        run: |
          set -euo pipefail
          "$SCRIPTS/verify_release_assets.sh" --tag "$TAG" --arch x86_64
